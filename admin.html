<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sistem - SK Mantin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-page: #0f172a;
      --card-bg: #1e293b;
      --neon-cyan: #38bdf8;
      --neon-glow: rgba(56, 189, 248, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-soft: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-page); color: var(--text-main); padding: 24px 16px; min-height: 100vh; }
    .container { max-width: 1300px; margin: 0 auto; }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-soft);
    }

    .btn-nav {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      color: var(--neon-cyan);
      border: 1.5px solid var(--neon-cyan);
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-nav:hover { background: var(--neon-cyan); color: #0f172a; box-shadow: 0 0 15px var(--neon-glow); }

    .header-section { margin-bottom: 25px; }
    .header-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--neon-cyan);
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.78rem;
      margin-bottom: 6px;
    }
    .header-title { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }

    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .selector-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .form-select, .search-box {
      background: #0f172a;
      border: 1.5px solid var(--border-soft);
      color: #ffffff;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      outline: none;
    }
    .form-select:focus, .search-box:focus { border-color: var(--neon-cyan); }

    .btn-action-primary {
      background: var(--neon-cyan);
      color: #0f172a;
      border: none;
      padding: 9px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action-primary:hover { transform: translateY(-2px); box-shadow: 0 0 12px var(--neon-glow); }

    .mode-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #0b1329;
      color: #38bdf8;
      border: 1px solid #334155;
    }

    /* 1. TAMPILAN BARIS BIASA (ROW-WISE) */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      overflow-x: auto;
      max-height: 550px;
    }

    .admin-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .admin-table th {
      background: #0b1329;
      color: var(--neon-cyan);
      padding: 12px 14px;
      text-align: left;
      border-bottom: 2px solid var(--border-soft);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .admin-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #334155;
      color: var(--text-main);
    }
    .admin-table tr:hover { background: rgba(56, 189, 248, 0.05); }

    .btn-table-edit {
      background: rgba(56, 189, 248, 0.15);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      margin-right: 4px;
    }
    .btn-table-delete {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* 2. TAMPILAN MENGIKUT KOLUM (COLUMN-WISE GRID) */
    .columns-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .column-card {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      max-height: 550px;
    }

    .column-card-header {
      padding: 14px 16px;
      background: #0b1329;
      border-bottom: 1.5px solid var(--border-soft);
      border-radius: 16px 16px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .column-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--neon-cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .column-items-list {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .column-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .column-item-text {
      flex: 1;
      word-break: break-word;
      padding-right: 8px;
    }

    .column-add-box {
      padding: 12px;
      border-top: 1px solid #334155;
      display: flex;
      gap: 6px;
      background: #0b1329;
      border-radius: 0 0 16px 16px;
    }

    .input-col-add {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      outline: none;
    }
    .input-col-add:focus { border-color: var(--neon-cyan); }

    .btn-col-add {
      background: var(--neon-cyan);
      color: #0f172a;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.8rem;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-box {
      background: #1e293b;
      border: 1px solid var(--neon-cyan);
      border-radius: 18px;
      width: 100%;
      max-width: 650px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 0 30px var(--neon-glow);
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-soft); padding-bottom: 12px; margin-bottom: 16px; }
    .modal-title { font-size: 1.15rem; font-weight: 800; color: var(--neon-cyan); }
    .close-modal-btn { background: none; border: none; font-size: 1.4rem; color: var(--text-muted); cursor: pointer; }

    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .form-label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
    .form-control {
      background: #0f172a;
      border: 1.5px solid var(--border-soft);
      color: #ffffff;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
    }
    .form-control:focus { border-color: var(--neon-cyan); }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .btn-secondary { padding: 9px 16px; border-radius: 8px; background: #334155; color: #fff; border: none; cursor: pointer; }

    .toast-msg {
      position: fixed;
      bottom: 25px;
      right: 25px;
      padding: 12px 20px;
      border-radius: 10px;
      background: #0b1329;
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 600;
      border-left: 4px solid var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      display: none;
      z-index: 2000;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-nav">
      <a href="./index.html" class="btn-nav">
        <i class="fas fa-home"></i> Kembali ke Homepage
      </a>
      <div style="font-size:0.85rem; color:var(--text-muted);">
        <i class="fas fa-user-shield" style="color:var(--neon-cyan);"></i> <span id="adminName">Admin</span>
      </div>
    </div>

    <header class="header-section">
      <span class="header-badge">KONSOL ADMIN</span>
      <h1 class="header-title">Pengurusan Data SeMaNeS</h1>
    </header>

    <!-- PANEL PEMILIHAN DATA -->
    <div class="control-panel">
      <div class="selector-group">
        <div>
          <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:4px;">Pangkalan Data:</label>
          <select id="dbSelector" class="form-select" onchange="handleDbChange()">
            <option value="db_sekolah">1. DB Sekolah</option>
            <option value="homepage">2. DB Homepage</option>
            <option value="kurikulum">3. DB Kurikulum</option>
            <option value="hem">4. DB Hal Ehwal Murid</option>
            <option value="kokurikulum">5. DB Kokurikulum</option>
          </select>
        </div>

        <div>
          <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:4px;">Pilih Data:</label>
          <select id="sheetSelector" class="form-select" onchange="fetchCurrentSheetData()"></select>
        </div>

        <div>
          <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:4px;">Carian Data:</label>
          <input type="text" id="searchInput" class="search-box" placeholder="Cari dalam jadual..." oninput="handleSearch()">
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:10px;">
        <div id="modeIndicator" class="mode-indicator">
          <i class="fas fa-table"></i> Mod Baris
        </div>
        <button id="btnAddRowBtn" class="btn-action-primary" onclick="openAddModal()">
          <i class="fas fa-plus"></i> Tambah Rekod
        </button>
      </div>
    </div>

    <!-- 1. TAMPILAN BARIS BIASA (ROW-WISE) -->
    <div id="rowWiseContainer" class="table-container">
      <table class="admin-table">
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr><td style="text-align:center; padding:30px; color:var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> Memuatkan pangkalan data...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 2. TAMPILAN MENGIKUT KOLUM (COLUMN-WISE) -->
    <div id="columnWiseContainer" class="columns-grid-container" style="display:none;"></div>
  </div>

  <!-- MODAL EDIT / TAMBAH ROW (UNTUK MOD BARIS) -->
  <div class="modal-overlay" id="crudModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="crudModalTitle">Ubah Data Baris</div>
        <button class="close-modal-btn" onclick="closeModal('crudModal')">&times;</button>
      </div>
      <form id="crudForm" onsubmit="handleCrudSubmit(event)">
        <input type="hidden" id="editRowIndex">
        <div id="dynamicFormFields"></div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeModal('crudModal')">Batal</button>
          <button type="submit" id="btnSaveCrud" class="btn-action-primary">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL EDIT ITEM KOLUM TUNGGAL -->
  <div class="modal-overlay" id="colItemModal">
    <div class="modal-box" style="max-width:450px;">
      <div class="modal-header">
        <div class="modal-title" id="colModalTitle">Edit Item Kolum</div>
        <button class="close-modal-btn" onclick="closeModal('colItemModal')">&times;</button>
      </div>
      <form id="colItemForm" onsubmit="handleSaveColItem(event)">
        <input type="hidden" id="editColIdx">
        <input type="hidden" id="editItemIdx">
        <div class="form-group">
          <label class="form-label">Nilai Item:</label>
          <input type="text" id="editItemValue" class="form-control" required>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeModal('colItemModal')">Batal</button>
          <button type="submit" class="btn-action-primary">Simpan Item</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toastNotification" class="toast-msg"></div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8zXrm-gkbNTmWF4Td_jvNmwGDDyINJz6Ub0KeqpLXw8blt5-lL1idBe5DdOOAB81s6w/exec";

    // 1. Sekatan Keselamatan Admin
    const activeUser = JSON.parse(sessionStorage.getItem("semanes_user"));
    if (!activeUser || !activeUser.peranan || activeUser.peranan.toLowerCase() !== "admin") {
      alert("Akses dinafikan! Halaman ini dikhaskan untuk Admin sahaja.");
      window.location.href = "./login.html";
    } else {
      document.getElementById('adminName').innerText = `${activeUser.nama} (Admin)`;
    }

    const COLUMN_WISE_SHEETS = [
      "data sekolah",
      "data kurikulum",
      "data hem",
      "data koko"
    ];

    let currentHeaders = [];
    let currentRows = [];
    let isEditing = false;
    let isColumnWise = false;
    let columnDataMap = {};
    let globalMuridOptions = { tahun: [], kelas: [], agama: [], bacaan: [], guruTasmik: [], uniform: [], persatuan: [], sukan: [], rumahSukan: [] };

    function showToast(msg, isError = false) {
      const t = document.getElementById('toastNotification');
      t.innerText = msg;
      t.style.borderLeftColor = isError ? '#ef4444' : '#38bdf8';
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    window.addEventListener('load', () => {
      fetchCurrentSheetData();
    });

    function handleDbChange() {
      fetchCurrentSheetData(null);
    }

    async function fetchCurrentSheetData(targetSheet = null) {
      const dbKey = document.getElementById('dbSelector').value;
      const sheetName = targetSheet || document.getElementById('sheetSelector').value;
      
      const tb = document.getElementById('tableBody');
      tb.innerHTML = '<tr><td colspan="15" style="text-align:center; padding:30px; color:#94a3b8;"><i class="fas fa-spinner fa-spin"></i> Memuatkan data...</td></tr>';

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'admin_get_sheet_data', dbKey: dbKey, sheetName: sheetName })
        });
        const data = await res.json();

        if (data.success) {
          const sSelector = document.getElementById('sheetSelector');
          sSelector.innerHTML = '';
          data.sheets.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.innerText = s;
            if (s === data.currentSheet) opt.selected = true;
            sSelector.appendChild(opt);
          });

          currentHeaders = data.headers;
          currentRows = data.rows;
          if (data.muridOptions) {
            globalMuridOptions = data.muridOptions;
          }

          const cleanSheetName = (data.currentSheet || "").toLowerCase().trim();
          isColumnWise = COLUMN_WISE_SHEETS.includes(cleanSheetName);

          const modeIndicator = document.getElementById('modeIndicator');
          const btnAddRow = document.getElementById('btnAddRowBtn');

          if (isColumnWise) {
            modeIndicator.innerHTML = '<i class="fas fa-columns"></i> Mod Kolum (Column-wise)';
            modeIndicator.style.color = '#a855f7';
            modeIndicator.style.borderColor = '#a855f7';
            btnAddRow.style.display = 'none';
            document.getElementById('rowWiseContainer').style.display = 'none';
            document.getElementById('columnWiseContainer').style.display = 'grid';
            
            buildColumnDataMap();
            renderColumnWiseGrid();
          } else {
            modeIndicator.innerHTML = '<i class="fas fa-table"></i> Mod Baris (Row-wise)';
            modeIndicator.style.color = '#38bdf8';
            modeIndicator.style.borderColor = '#334155';
            btnAddRow.style.display = 'inline-flex';
            document.getElementById('rowWiseContainer').style.display = 'block';
            document.getElementById('columnWiseContainer').style.display = 'none';
            renderRowWiseTable(currentHeaders, currentRows);
          }
        } else {
          showToast(data.message || "Gagal memuatkan data.", true);
        }
      } catch (err) {
        showToast("Ralat sambungan: " + err.toString(), true);
      }
    }

    // ========================================================
    // LOGIK MOD KOLUM (COLUMN-WISE EDITING)
    // ========================================================
    function buildColumnDataMap() {
      columnDataMap = {};
      currentHeaders.forEach((h, colIdx) => {
        columnDataMap[colIdx] = {
          header: h || `Kolum ${colIdx + 1}`,
          items: []
        };
      });

      currentRows.forEach(r => {
        currentHeaders.forEach((h, colIdx) => {
          const val = r.values[colIdx];
          if (val !== undefined && val !== null && val.toString().trim() !== '') {
            columnDataMap[colIdx].items.push(val.toString().trim());
          }
        });
      });
    }

    function renderColumnWiseGrid(filterText = '') {
      const container = document.getElementById('columnWiseContainer');
      container.innerHTML = '';

      const colKeys = Object.keys(columnDataMap);
      if (colKeys.length === 0) {
        container.innerHTML = '<div style="color:#94a3b8; padding:20px;">Helaian ini tiada sebarang kolum.</div>';
        return;
      }

      colKeys.forEach(colIdx => {
        const col = columnDataMap[colIdx];
        const card = document.createElement('div');
        card.className = 'column-card';

        let displayItems = col.items;
        if (filterText) {
          displayItems = col.items.filter(item => item.toLowerCase().includes(filterText.toLowerCase()));
        }

        let itemsHtml = '';
        if (displayItems.length === 0) {
          itemsHtml = '<div style="color:#64748b; font-size:0.8rem; text-align:center; padding:15px;">Tiada item.</div>';
        } else {
          displayItems.forEach((item, itemIdx) => {
            itemsHtml += `
              <div class="column-item-row">
                <span class="column-item-text">${item}</span>
                <div style="white-space:nowrap;">
                  <button type="button" class="btn-table-edit" onclick="openColItemEdit(${colIdx}, ${itemIdx})"><i class="fas fa-edit"></i></button>
                  <button type="button" class="btn-table-delete" onclick="handleDeleteColItem(${colIdx}, ${itemIdx})"><i class="fas fa-trash"></i></button>
                </div>
              </div>
            `;
          });
        }

        card.innerHTML = `
          <div class="column-card-header">
            <span class="column-title" title="${col.header}">${col.header}</span>
            <span style="font-size:0.75rem; background:#1e293b; padding:2px 8px; border-radius:10px; color:var(--text-muted);">
              ${col.items.length} item
            </span>
          </div>
          <div class="column-items-list" id="colList_${colIdx}">
            ${itemsHtml}
          </div>
          <div class="column-add-box">
            <input type="text" id="addInput_${colIdx}" class="input-col-add" placeholder="Tambah nilai baharu...">
            <button type="button" class="btn-col-add" onclick="handleAddColItem(${colIdx})"><i class="fas fa-plus"></i></button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function handleAddColItem(colIdx) {
      const input = document.getElementById(`addInput_${colIdx}`);
      const val = input.value.trim();
      if (!val) {
        showToast("Sila masukkan nilai item.", true);
        return;
      }

      columnDataMap[colIdx].items.push(val);
      input.value = "";
      renderColumnWiseGrid();

      await syncColumnToBackend(colIdx);
    }

    function openColItemEdit(colIdx, itemIdx) {
      document.getElementById('editColIdx').value = colIdx;
      document.getElementById('editItemIdx').value = itemIdx;
      document.getElementById('editItemValue').value = columnDataMap[colIdx].items[itemIdx];
      document.getElementById('colModalTitle').innerText = `Edit: ${columnDataMap[colIdx].header}`;
      openModal('colItemModal');
    }

    async function handleSaveColItem(e) {
      e.preventDefault();
      const colIdx = document.getElementById('editColIdx').value;
      const itemIdx = document.getElementById('editItemIdx').value;
      const newVal = document.getElementById('editItemValue').value.trim();

      if (!newVal) return;
      columnDataMap[colIdx].items[itemIdx] = newVal;
      closeModal('colItemModal');
      renderColumnWiseGrid();

      await syncColumnToBackend(colIdx);
    }

    async function handleDeleteColItem(colIdx, itemIdx) {
      const itemNama = columnDataMap[colIdx].items[itemIdx];
      if (!confirm(`Padam "${itemNama}" dari ${columnDataMap[colIdx].header}?`)) return;

      columnDataMap[colIdx].items.splice(itemIdx, 1);
      renderColumnWiseGrid();

      await syncColumnToBackend(colIdx);
    }

    async function syncColumnToBackend(colIdx) {
      const dbKey = document.getElementById('dbSelector').value;
      const sheetName = document.getElementById('sheetSelector').value;
      const items = columnDataMap[colIdx].items;
      const realColNumber = parseInt(colIdx) + 1;

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'admin_update_column_items',
            dbKey: dbKey,
            sheetName: sheetName,
            colIndex: realColNumber,
            items: items
          })
        });
        const result = await res.json();
        if (result.success) {
          showToast(`Kolum "${columnDataMap[colIdx].header}" berjaya dikemas kini!`);
        } else {
          showToast("Ralat kemaskini: " + result.message, true);
        }
      } catch (err) {
        showToast("Ralat sambungan pelayan: " + err.toString(), true);
      }
    }

    // ========================================================
    // LOGIK MOD BARIS & DROPDOWN LENGKAP DATA MURID
    // ========================================================
    function renderRowWiseTable(headers, rows) {
      const th = document.getElementById('tableHead');
      const tb = document.getElementById('tableBody');
      th.innerHTML = '';
      tb.innerHTML = '';

      if (!headers || headers.length === 0) {
        tb.innerHTML = '<tr><td style="text-align:center; padding:20px;">Helaian ini kosong.</td></tr>';
        return;
      }

      let trHead = '<tr>';
      headers.forEach(h => trHead += `<th>${h}</th>`);
      trHead += '<th style="text-align:center;">Tindakan</th></tr>';
      th.innerHTML = trHead;

      if (!rows || rows.length === 0) {
        tb.innerHTML = `<tr><td colspan="${headers.length + 1}" style="text-align:center; padding:20px; color:#94a3b8;">Tiada rekod data dijumpai.</td></tr>`;
        return;
      }

      rows.forEach(r => {
        const tr = document.createElement('tr');
        headers.forEach((h, idx) => {
          const val = r.values[idx] !== undefined ? r.values[idx] : '';
          tr.innerHTML += `<td>${val}</td>`;
        });
        tr.innerHTML += `
          <td style="text-align:center; white-space:nowrap;">
            <button class="btn-table-edit" onclick="openEditModal(${r.rowIndex})"><i class="fas fa-edit"></i> Edit</button>
            <button class="btn-table-delete" onclick="handleDeleteRow(${r.rowIndex})"><i class="fas fa-trash"></i> Padam</button>
          </td>
        `;
        tb.appendChild(tr);
      });
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (isColumnWise) {
        renderColumnWiseGrid(q);
      } else {
        if (!q) {
          renderRowWiseTable(currentHeaders, currentRows);
          return;
        }
        const filtered = currentRows.filter(r => r.values.some(v => v.toString().toLowerCase().includes(q.toLowerCase())));
        renderRowWiseTable(currentHeaders, filtered);
      }
    }

    function openAddModal() {
      isEditing = false;
      document.getElementById('crudModalTitle').innerText = `Tambah Rekod: ${document.getElementById('sheetSelector').value}`;
      document.getElementById('editRowIndex').value = "";
      buildDynamicForm();
      openModal('crudModal');
    }

    function openEditModal(rowIndex) {
      isEditing = true;
      document.getElementById('crudModalTitle').innerText = `Kemas Kini Baris ${rowIndex}`;
      document.getElementById('editRowIndex').value = rowIndex;
      const rowObj = currentRows.find(r => r.rowIndex === rowIndex);
      buildDynamicForm(rowObj ? rowObj.values : null);
      openModal('crudModal');
    }

    // PEMBINA BORANG PINTAR SESUAI LAJUR SEBENAR DATA MURID
    function buildDynamicForm(values = null) {
      const container = document.getElementById('dynamicFormFields');
      container.innerHTML = '';
      
      const dbKey = document.getElementById('dbSelector').value;
      const sheetName = (document.getElementById('sheetSelector').value || "").toLowerCase().trim();
      const isDataMurid = (dbKey === "db_sekolah" && sheetName === "data murid");

      currentHeaders.forEach((h, idx) => {
        const val = values ? (values[idx] || '') : '';
        const hUpper = (h || "").toUpperCase().trim();
        const div = document.createElement('div');
        div.className = 'form-group';

        let isDropdown = false;
        let optList = [];
        let sourceLabel = '';

        if (isDataMurid) {
          if (hUpper === "TAHUN") {
            isDropdown = true;
            optList = globalMuridOptions.tahun || [];
            sourceLabel = '(Data Sekolah)';
          } else if (hUpper === "KELAS") {
            isDropdown = true;
            optList = globalMuridOptions.kelas || [];
            sourceLabel = '(Data Sekolah)';
          } else if (hUpper === "AGAMA") {
            isDropdown = true;
            optList = globalMuridOptions.agama || [];
            sourceLabel = '(Data Sekolah)';
          } else if (hUpper === "BACAAN") {
            isDropdown = true;
            optList = globalMuridOptions.bacaan || [];
            sourceLabel = '(Data Sekolah - eTasmik)';
          } else if (hUpper === "NAMA GURU TASMIK" || (hUpper.includes("GURU") && hUpper.includes("TASMIK"))) {
            isDropdown = true;
            optList = globalMuridOptions.guruTasmik || [];
            sourceLabel = '(Data Guru)';
          } else if (hUpper.includes("UNIFORM")) {
            isDropdown = true;
            optList = globalMuridOptions.uniform || [];
            sourceLabel = '(Data KOKO)';
          } else if (hUpper.includes("PERSATUAN") || hUpper.includes("KELAB")) {
            isDropdown = true;
            optList = globalMuridOptions.persatuan || [];
            sourceLabel = '(Data KOKO)';
          } else if (hUpper.includes("SUKAN") && !hUpper.includes("RUMAH")) {
            isDropdown = true;
            optList = globalMuridOptions.sukan || [];
            sourceLabel = '(Data KOKO)';
          } else if (hUpper.includes("RUMAH")) {
            isDropdown = true;
            optList = globalMuridOptions.rumahSukan || [];
            sourceLabel = '(Data KOKO)';
          }
        }

        if (isDropdown && optList.length > 0) {
          let optionsHtml = '<option value="">-- Pilih --</option>';
          optList.forEach(opt => {
            const isSel = (opt.trim().toLowerCase() === val.trim().toLowerCase()) ? 'selected' : '';
            optionsHtml += `<option value="${opt}" ${isSel}>${opt}</option>`;
          });

          div.innerHTML = `
            <label class="form-label">${h} <span style="color:var(--neon-cyan); font-size:0.75rem;">${sourceLabel}</span></label>
            <select class="form-control crud-input" data-col="${idx}">
              ${optionsHtml}
            </select>
          `;
        } else {
          div.innerHTML = `
            <label class="form-label">${h}</label>
            <input type="text" class="form-control crud-input" data-col="${idx}" value="${val}">
          `;
        }

        container.appendChild(div);
      });
    }

    async function handleCrudSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSaveCrud');
      const dbKey = document.getElementById('dbSelector').value;
      const sheetName = document.getElementById('sheetSelector').value;
      const rowIndex = document.getElementById('editRowIndex').value;

      const inputs = document.querySelectorAll('.crud-input');
      const rowData = Array.from(inputs).map(inp => inp.value);

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
      const action = isEditing ? 'admin_update_row' : 'admin_add_row';

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: action, dbKey: dbKey, sheetName: sheetName, rowIndex: rowIndex, rowData: rowData
          })
        });
        const result = await res.json();
        btn.disabled = false;
        btn.innerHTML = 'Simpan Perubahan';

        if (result.success) {
          showToast(isEditing ? "Rekod dikemas kini!" : "Rekod baharu ditambah!");
          closeModal('crudModal');
          fetchCurrentSheetData(sheetName);
        } else {
          showToast("Ralat: " + result.message, true);
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'Simpan Perubahan';
        showToast("Ralat: " + err.toString(), true);
      }
    }

    async function handleDeleteRow(rowIndex) {
      if (!confirm(`Padam baris ${rowIndex}?`)) return;
      const dbKey = document.getElementById('dbSelector').value;
      const sheetName = document.getElementById('sheetSelector').value;

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'admin_delete_row', dbKey: dbKey, sheetName: sheetName, rowIndex: rowIndex })
        });
        const result = await res.json();
        if (result.success) {
          showToast("Baris berjaya dipadam!");
          fetchCurrentSheetData(sheetName);
        } else {
          showToast("Gagal memadam: " + result.message, true);
        }
      } catch (err) {
        showToast("Ralat: " + err.toString(), true);
      }
    }
  </script>
</body>
