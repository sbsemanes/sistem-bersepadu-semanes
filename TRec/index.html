<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRec - SK Mantin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Favicon & Mobile Web App Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#10b981">

  <script>
    // ==========================================
    // SISTEM KESELAMATAN (AUTH GUARD PANTAS)
    // ==========================================
    const sessionUserData = sessionStorage.getItem("semanes_user");
    if (!sessionUserData) {
      alert("Sila log masuk terlebih dahulu untuk mengakses sistem TRec.");
      window.location.replace("../login.html");
    }
  </script>

  <style>
    :root {
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --neon-green: #10b981;
      --neon-green-glow: rgba(16, 185, 129, 0.45);
      --neon-accent: #059669;
      --neon-subtle: #ecfdf5;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-soft: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-page); color: var(--text-main); padding: 18px 14px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; }

    /* BAR NAVIGASI ATAS */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1.5px solid var(--border-soft);
    }

    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #ffffff;
      color: var(--neon-accent);
      border: 1.5px solid var(--neon-green);
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.15);
      transition: all 0.25s ease;
    }

    .btn-back-home:hover {
      background: var(--neon-green);
      color: #ffffff;
      box-shadow: 0 0 16px var(--neon-green-glow);
      transform: translateY(-2px);
    }

    .user-info-pill {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--neon-accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--neon-subtle);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .app-title-box { margin-bottom: 22px; }
    .app-badge {
      display: inline-block;
      padding: 4px 12px;
      background: var(--neon-subtle);
      color: var(--neon-accent);
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 800;
      margin-bottom: 6px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.15);
    }
    .app-title { font-size: 1.8rem; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; }

    /* PANEL TAPISAN */
    .filter-card {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border-soft);
      padding: 20px;
      margin-bottom: 22px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04), 0 0 20px rgba(16, 185, 129, 0.08);
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }

    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 150px;
    }

    .filter-label { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); }
    .filter-select, .search-box {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--border-soft);
      font-size: 0.88rem;
      outline: none;
      background: #f8fafc;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .filter-select:focus, .search-box:focus {
      background: #ffffff;
      border-color: var(--neon-green);
      box-shadow: 0 0 12px var(--neon-green-glow);
    }

    .btn-sync {
      padding: 10px 14px;
      background: #ffffff;
      color: var(--text-muted);
      border: 1.5px solid var(--border-soft);
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      transition: all 0.2s;
    }
    .btn-sync:hover {
      border-color: var(--neon-green);
      color: var(--neon-accent);
    }

    .summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .checkbox-my-students {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .checkbox-my-students input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--neon-green);
      cursor: pointer;
    }

    /* GRID SENARAI MURID */
    .student-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .student-card {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1.5px solid var(--border-soft);
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }
    .student-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(16, 185, 129, 0.15);
      border-color: var(--neon-green);
    }

    .student-header {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .student-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      background: #e2e8f0;
      border: 2.5px solid var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green-glow);
      flex-shrink: 0;
    }

    .student-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.3;
    }

    .student-class-badge {
      display: inline-block;
      padding: 3px 8px;
      background: var(--neon-subtle);
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--neon-accent);
      margin-top: 4px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .reading-status-box {
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px dashed var(--border-soft);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      margin-bottom: 5px;
    }
    .status-row:last-child { margin-bottom: 0; }

    .status-tag {
      font-weight: 800;
      color: var(--neon-accent);
    }

    .update-time-text {
      font-size: 0.72rem;
      color: #94a3b8;
      text-align: right;
      margin-top: 6px;
    }

    .btn-update {
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      background: var(--neon-green);
      color: #ffffff;
      border: none;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--neon-green-glow);
      transition: all 0.2s ease;
    }
    .btn-update:hover {
      background: var(--neon-accent);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.6);
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 26px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.15), 0 0 25px rgba(16, 185, 129, 0.2);
      border: 1px solid var(--border-soft);
    }

    .modal-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 16px; color: #0f172a; }
    
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 5px; }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border-soft);
      font-size: 0.88rem;
      outline: none;
      background: #f8fafc;
    }
    .form-input:focus {
      background: #ffffff;
      border-color: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green-glow);
    }

    .photo-section {
      text-align: center;
      margin-bottom: 16px;
      padding: 14px;
      border: 1.5px dashed var(--neon-green);
      background: var(--neon-subtle);
      border-radius: 16px;
    }
    .preview-photo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px;
      display: block;
      border: 3px solid var(--neon-green);
      box-shadow: 0 0 12px var(--neon-green-glow);
    }
    .btn-camera {
      background: #ffffff;
      color: var(--neon-accent);
      border: 1.5px solid var(--neon-green);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
    }
    .btn-camera:hover { background: var(--neon-green); color: #ffffff; }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }
    .btn-cancel {
      padding: 10px 16px;
      border-radius: 10px;
      background: #f1f5f9;
      color: var(--text-muted);
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .toast-msg {
      position: fixed;
      bottom: 25px;
      right: 25px;
      padding: 12px 20px;
      border-radius: 12px;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border-left: 4px solid var(--neon-green);
      display: none;
      z-index: 2000;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- BAR NAVIGASI ATAS: BUTANG KEMBALI & PROFIL GURU -->
    <div class="top-header">
      <a href="../index.html" class="btn-back-home">
        <i class="fas fa-home"></i> Kembali ke Homepage
      </a>
      <div class="user-info-pill">
        <i class="fas fa-user-circle"></i> <span id="currentTeacherLabel">Memuatkan...</span>
      </div>
    </div>

    <div class="app-title-box">
      <span class="app-badge">SISTEM TRec PENDIDIKAN ISLAM</span>
      <h1 class="app-title">Rekod Bacaan Tasmik SK Mantin</h1>
    </div>

    <!-- PANEL TAPISAN -->
    <div class="filter-card">
      <div class="filter-item">
        <label class="filter-label">Tahun:</label>
        <select id="filterTahun" class="filter-select" onchange="applyFilters()">
          <option value="">Semua Tahun</option>
        </select>
      </div>

      <div class="filter-item">
        <label class="filter-label">Kelas:</label>
        <select id="filterKelas" class="filter-select" onchange="applyFilters()">
          <option value="">Semua Kelas</option>
        </select>
      </div>

      <div class="filter-item">
        <label class="filter-label">Guru Tasmik:</label>
        <select id="filterGuru" class="filter-select" onchange="applyFilters()">
          <option value="">Semua Guru Tasmik</option>
        </select>
      </div>

      <div class="filter-item" style="flex: 1.5;">
        <label class="filter-label">Cari Nama Murid:</label>
        <input type="text" id="filterSearch" class="search-box" placeholder="Menaip nama murid..." oninput="applyFilters()">
      </div>

      <button type="button" class="btn-sync" onclick="refreshData(true)" title="Segarkan Cache Data">
        <i class="fas fa-sync-alt" id="syncIcon"></i> Segar
      </button>
    </div>

    <div class="summary-bar">
      <div>Memaparkan: <strong id="studentCount" style="color:var(--neon-accent);">0</strong> murid (Agama Islam)</div>
      <div>
        <label class="checkbox-my-students">
          <input type="checkbox" id="checkOnlyMyStudents" onchange="toggleMyStudentsFilter()"> Tunjuk Murid Bawah Saya Sahaja
        </label>
      </div>
    </div>

    <!-- GRID SENARAI MURID -->
    <div class="student-grid" id="studentGrid">
      <div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">
        <i class="fas fa-spinner fa-spin fa-2x" style="color:var(--neon-green);"></i>
        <p style="margin-top:10px;">Sedang memuatkan data murid dari Google Sheets...</p>
      </div>
    </div>
  </div>

  <!-- MODAL KEMASKINI TASMIK -->
  <div class="modal-overlay" id="tasmikModal">
    <div class="modal-card">
      <h2 class="modal-title" id="mStudentName">Nama Murid</h2>

      <!-- PENGURUSAN FOTO KAMERA -->
      <div class="photo-section">
        <img id="mImgPreview" src="https://via.placeholder.com/150?text=Tiada+Gambar" class="preview-photo" alt="Foto Murid">
        <input type="file" id="cameraFileInput" accept="image/*" capture="environment" style="display:none;" onchange="handleFileSelect(event)">
        <button type="button" class="btn-camera" onclick="document.getElementById('cameraFileInput').click()">
          <i class="fas fa-camera"></i> Ambil / Muat Naik Foto
        </button>
      </div>

      <form id="tasmikForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="mRowIndex">

        <div class="form-group">
          <label class="form-label">Tahap / Bacaan Semasa:</label>
          <select id="mBacaan" class="form-input" required></select>
        </div>

        <div class="form-group">
          <label class="form-label">Muka Surat / Ayat:</label>
          <input type="text" id="mMukaSurat" class="form-input" placeholder="Contoh: M/S 15 atau Ayat 1-10" required>
        </div>

        <div class="form-group">
          <label class="form-label">Guru Tasmik:</label>
          <select id="mGuruTasmik" class="form-input" required></select>
        </div>

        <div class="form-group">
          <label class="form-label">Catatan Tambahan (Pilihan):</label>
          <input type="text" id="mCatatan" class="form-input" placeholder="Cth: Perlu ulang ayat 5, tajwid mantap">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('tasmikModal')">Batal</button>
          <button type="submit" id="btnSubmitTasmik" class="btn-update" style="width:auto; padding:10px 22px;">
            <i class="fas fa-save"></i> Simpan Kemaskini
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toastNotification" class="toast-msg"></div>

  <script>
    // MASUKKAN URL STANDALONE APPS SCRIPT eTASMIK ANDA DI SINI:
    const ETASMIK_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzf4c8BVEj6ZE2_7B2QejfNyqaZi7GS7_aqQnOTcwwFoGyAR5DYsFzlCNJYBhFWIbY/exec";

    const CLIENT_CACHE_KEY = "trec_client_cache_v1";
    const CLIENT_CACHE_TIME_KEY = "trec_client_cache_time";
    const CACHE_DURATION_MS = 10 * 60 * 1000; // 10 Minit client cache

    let allStudents = [];
    let dropdownData = {};
    let activeLoggedInTeacher = "";
    let capturedBase64 = null;

    function showToast(msg, isError = false) {
      const t = document.getElementById('toastNotification');
      t.innerText = msg;
      t.style.borderLeftColor = isError ? '#ef4444' : '#10b981';
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    window.addEventListener('load', () => {
      // Dapatkan maklumat sesi guru yang disahkan
      const activeUser = JSON.parse(sessionStorage.getItem("semanes_user"));
      if (activeUser && activeUser.nama) {
        activeLoggedInTeacher = activeUser.nama;
        document.getElementById('currentTeacherLabel').innerText = activeLoggedInTeacher;
      }

      // 1. Semak cache pelayar terlebih dahulu untuk paparan instant (0 saat)
      const cachedTime = localStorage.getItem(CLIENT_CACHE_TIME_KEY);
      const cachedPayload = localStorage.getItem(CLIENT_CACHE_KEY);
      const isFresh = cachedTime && (Date.now() - parseInt(cachedTime)) < CACHE_DURATION_MS;

      if (cachedPayload && isFresh) {
        try {
          const parsed = JSON.parse(cachedPayload);
          allStudents = parsed.murid;
          dropdownData = parsed.dropdown;
          populateFilters();
          applyFilters();
          // Segarkan data di latar belakang secara senyap
          fetchBackendData(false);
          return;
        } catch(e) {}
      }

      // Jika tiada cache atau cache tamat tempoh, muat turun biasa
      fetchBackendData(true);
    });

    async function fetchBackendData(showLoading = false) {
      const syncIcon = document.getElementById('syncIcon');
      if (syncIcon) syncIcon.classList.add('fa-spin');

      if (showLoading && allStudents.length === 0) {
        document.getElementById('studentGrid').innerHTML = `
          <div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">
            <i class="fas fa-spinner fa-spin fa-2x" style="color:var(--neon-green);"></i>
            <p style="margin-top:10px;">Sedang memuatkan data murid dari Google Sheets...</p>
          </div>
        `;
      }

      try {
        const res = await fetch(ETASMIK_APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'etasmik_get_data' })
        });
        const data = await res.json();

        if (data.success) {
          allStudents = data.murid;
          dropdownData = data.dropdown;

          // Simpan ke Cache Pelayar
          localStorage.setItem(CLIENT_CACHE_KEY, JSON.stringify(data));
          localStorage.setItem(CLIENT_CACHE_TIME_KEY, Date.now().toString());

          populateFilters();
          applyFilters();
        } else {
          showToast("Gagal memuatkan data: " + data.message, true);
        }
      } catch (err) {
        if (allStudents.length === 0) {
          showToast("Ralat sambungan: " + err.toString(), true);
        }
      } finally {
        if (syncIcon) syncIcon.classList.remove('fa-spin');
      }
    }

    function refreshData(manual = true) {
      if (manual) showToast("Menyegarkan data terkini dari pangkalan data...");
      localStorage.removeItem(CLIENT_CACHE_KEY);
      localStorage.removeItem(CLIENT_CACHE_TIME_KEY);
      fetchBackendData(true);
    }

    function populateFilters() {
      const fTahun = document.getElementById('filterTahun');
      const fKelas = document.getElementById('filterKelas');
      const fGuru = document.getElementById('filterGuru');

      const curTahun = fTahun.value;
      const curKelas = fKelas.value;
      const curGuru = fGuru.value;

      fTahun.innerHTML = '<option value="">Semua Tahun</option>';
      (dropdownData.tahun || []).forEach(t => {
        const opt = document.createElement('option');
        opt.value = t; opt.innerText = "Tahun " + t;
        if (t === curTahun) opt.selected = true;
        fTahun.appendChild(opt);
      });

      fKelas.innerHTML = '<option value="">Semua Kelas</option>';
      (dropdownData.kelas || []).forEach(k => {
        const opt = document.createElement('option');
        opt.value = k; opt.innerText = k;
        if (k === curKelas) opt.selected = true;
        fKelas.appendChild(opt);
      });

      fGuru.innerHTML = '<option value="">Semua Guru Tasmik</option>';
      (dropdownData.guruTasmik || []).forEach(g => {
        const opt = document.createElement('option');
        opt.value = g; opt.innerText = g;
        if (curGuru) {
          if (g === curGuru) opt.selected = true;
        } else if (activeLoggedInTeacher && g.toLowerCase().includes(activeLoggedInTeacher.toLowerCase())) {
          opt.selected = true;
        }
        fGuru.appendChild(opt);
      });
    }

    function toggleMyStudentsFilter() {
      const isCheck = document.getElementById('checkOnlyMyStudents').checked;
      const fGuru = document.getElementById('filterGuru');
      if (isCheck && activeLoggedInTeacher) {
        for (let i = 0; i < fGuru.options.length; i++) {
          if (fGuru.options[i].value.toLowerCase().includes(activeLoggedInTeacher.toLowerCase())) {
            fGuru.selectedIndex = i;
            break;
          }
        }
      } else if (!isCheck) {
        fGuru.value = "";
      }
      applyFilters();
    }

    function applyFilters() {
      const tahun = document.getElementById('filterTahun').value.toLowerCase();
      const kelas = document.getElementById('filterKelas').value.toLowerCase();
      const guru = document.getElementById('filterGuru').value.toLowerCase();
      const search = document.getElementById('filterSearch').value.toLowerCase();

      const filtered = allStudents.filter(m => {
        const matchTahun = !tahun || m.tahun.toLowerCase() === tahun;
        const matchKelas = !kelas || m.kelas.toLowerCase() === kelas;
        const matchGuru = !guru || (m.guruTasmik && m.guruTasmik.toLowerCase().includes(guru));
        const matchSearch = !search || m.nama.toLowerCase().includes(search);
        return matchTahun && matchKelas && matchGuru && matchSearch;
      });

      document.getElementById('studentCount').innerText = filtered.length;
      renderStudentsGrid(filtered);
    }

    function renderStudentsGrid(students) {
      const grid = document.getElementById('studentGrid');
      grid.innerHTML = '';

      if (students.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">Tiada rekod murid Islam yang sepadan dengan tapisan ini.</div>';
        return;
      }

      students.forEach(m => {
        const card = document.createElement('div');
        card.className = 'student-card';

        const imgSrc = m.gambar || 'https://via.placeholder.com/150?text=Murid';
        const bacaanStr = m.bacaan || '<span style="color:#94a3b8;">Belum Ditentukan</span>';
        const mksStr = m.mukaSurat || '-';
        const guruStr = m.guruTasmik || '<span style="color:#e11d48;">Belum Diagihkan</span>';
        const tarikhStr = m.tarikhKemaskini ? `<div class="update-time-text"><i class="far fa-clock"></i> Kemas kini: ${m.tarikhKemaskini}</div>` : '';

        card.innerHTML = `
          <div>
            <div class="student-header">
              <img src="${imgSrc}" class="student-avatar" alt="${m.nama}" onerror="this.src='https://via.placeholder.com/150?text=Murid'">
              <div>
                <div class="student-name">${m.nama}</div>
                <div class="student-class-badge">${m.tahun} ${m.kelas}</div>
              </div>
            </div>

            <div class="reading-status-box">
              <div class="status-row">
                <span style="color:var(--text-muted);">Tahap:</span>
                <span class="status-tag">${bacaanStr}</span>
              </div>
              <div class="status-row">
                <span style="color:var(--text-muted);">M/Surat:</span>
                <strong style="color:#0f172a;">${mksStr}</strong>
              </div>
              <div class="status-row" style="font-size:0.75rem; margin-top:6px; border-top:1px solid #e2e8f0; padding-top:4px;">
                <span style="color:var(--text-muted);">Guru:</span>
                <strong>${guruStr}</strong>
              </div>
              ${tarikhStr}
            </div>
          </div>

          <button class="btn-update" onclick="openUpdateModal(${m.rowIndex})">
            <i class="fas fa-edit"></i> Kemaskini Tasmik
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function openUpdateModal(rowIndex) {
      const student = allStudents.find(s => s.rowIndex === rowIndex);
      if (!student) return;

      capturedBase64 = null;
      document.getElementById('mRowIndex').value = rowIndex;
      document.getElementById('mStudentName').innerText = `${student.nama} (${student.tahun} ${student.kelas})`;
      document.getElementById('mMukaSurat').value = student.mukaSurat || '';
      document.getElementById('mCatatan').value = student.catatan || '';
      document.getElementById('mImgPreview').src = student.gambar || 'https://via.placeholder.com/150?text=Tiada+Gambar';

      const mBacaan = document.getElementById('mBacaan');
      mBacaan.innerHTML = '<option value="">-- Pilih Bacaan --</option>';
      (dropdownData.bacaan || []).forEach(b => {
        const opt = document.createElement('option');
        opt.value = b; opt.innerText = b;
        if (student.bacaan && student.bacaan.toLowerCase() === b.toLowerCase()) opt.selected = true;
        mBacaan.appendChild(opt);
      });

      const mGuru = document.getElementById('mGuruTasmik');
      mGuru.innerHTML = '<option value="">-- Pilih Guru Tasmik --</option>';
      (dropdownData.guruTasmik || []).forEach(g => {
        const opt = document.createElement('option');
        opt.value = g; opt.innerText = g;
        if (student.guruTasmik && student.guruTasmik.toLowerCase() === g.toLowerCase()) {
          opt.selected = true;
        } else if (!student.guruTasmik && activeLoggedInTeacher && g.toLowerCase().includes(activeLoggedInTeacher.toLowerCase())) {
          opt.selected = true;
        }
        mGuru.appendChild(opt);
      });

      openModal('tasmikModal');
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const maxDim = 600;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) { height *= maxDim / width; width = maxDim; }
          } else {
            if (height > maxDim) { width *= maxDim / height; height = maxDim; }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          capturedBase64 = canvas.toDataURL('image/jpeg', 0.8);
          document.getElementById('mImgPreview').src = capturedBase64;
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitTasmik');
      const rowIndex = parseInt(document.getElementById('mRowIndex').value);
      const bacaan = document.getElementById('mBacaan').value;
      const mukaSurat = document.getElementById('mMukaSurat').value.trim();
      const guruTasmik = document.getElementById('mGuruTasmik').value;
      const catatan = document.getElementById('mCatatan').value.trim();

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

      try {
        const res = await fetch(ETASMIK_APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'etasmik_update_rekod',
            rowIndex: rowIndex,
            bacaan: bacaan,
            mukaSurat: mukaSurat,
            guruTasmik: guruTasmik,
            catatan: catatan,
            base64Image: capturedBase64
          })
        });

        const result = await res.json();
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Simpan Kemaskini';

        if (result.success) {
          showToast("Rekod tasmik berjaya dikemas kini!");
          closeModal('tasmikModal');

          // Kemas kini paparan aktif tempatan serta-merta
          const target = allStudents.find(s => s.rowIndex === rowIndex);
          if (target) {
            target.bacaan = bacaan;
            target.mukaSurat = mukaSurat;
            target.guruTasmik = guruTasmik;
            target.catatan = catatan;
            if (capturedBase64) target.gambar = capturedBase64;
            const now = new Date();
            target.tarikhKemaskini = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth()+1).padStart(2, '0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
          }

          // Segarkan data simpanan cache pelayar tempatan
          localStorage.setItem(CLIENT_CACHE_KEY, JSON.stringify({ murid: allStudents, dropdown: dropdownData }));

          applyFilters();
        } else {
          showToast("Ralat: " + result.message, true);
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Simpan Kemaskini';
        showToast("Ralat sambungan: " + err.toString(), true);
      }
    }
  </script>
</body>
</html>
